<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../src/output.css">
    <script src="todo.js"></script>
</head>
<body>
    <!-- navbar div -->
    <div class="w-full h-20 bg-orange-900 flex items-center justify-between fixed top-0 left-0">
        <h1 class="text-3xl font-bold flex text-white pl-3">Todo App</h1>
        <button id="showtodo" class="bg-white p-2 px-3 mr-4 hover:rounded-2xl hover:border-2 hover:border-orange-950 transition-all duration-200 hover:bg-orange-200">Add Todo</button>

    </div>
    <!-- todo div -->
    <div class="h-full w-full flex items-center justify-center">
        <!-- input part -->
        <div id="addDiv" class="border p-5 h-fit w-150 flex flex-col gap-5 rounded-2xl">
            <h1 class="text-center text-3xl font-bold">Add Todo</h1>
            <input id="input" class="w-full border p-2" type="text">
            <select  class="w-full border p-2"  id="importance">
                <option value="important">Important</option>
                <option value="normal">Normal</option>
                <option value="optional">Optional</option>
            </select>
            <button id="addbtn" class="bg-linear-90 from-orange-900 to-orange-900 via-orange-500 p-2 rounded-md text-xl font-bold text-white hover:text-black hover:border-2 transition-all duration-200">Add</button>
        </div>

    </div>
</body>
</html>
